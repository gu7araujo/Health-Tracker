# SwiftLint Configuration for HealthTracker

# Opt-in rules
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - sorted_first_last
  - trailing_closure

# Custom rules
custom_rules:
  no_print:
    name: "No Print Statements"
    regex: "print\\("
    message: "Use logger instead of print() for consistent logging"
    severity: warning

# Excluded paths
excluded:
  - Pods
  - .build
  - DerivedData
  - vendor
  - .swiftpm

# Line length
line_length:
  warning: 120
  error: 200

# File length
file_length:
  warning: 500
  error: 1000

# Type body length
type_body_length:
  warning: 300
  error: 500

# Function body length
function_body_length:
  warning: 50
  error: 100

# Identifier name rules
identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 40
  excluded:
    - id
    - i
    - x
    - y

# Disabled rules
disabled_rules:
  - trailing_comma
