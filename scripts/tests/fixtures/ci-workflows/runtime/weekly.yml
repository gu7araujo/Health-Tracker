# Must fail only the timeout sum: the same steps as runtime/ci.yml, so no drift.
jobs:
  test:
    timeout-minutes: 75
    permissions:
      issues: write
    steps:
      - name: Simulator runtime
        timeout-minutes: 30
        run: scripts/ci/install-simulator-runtime.sh
      - name: Quality gate
        id: quality
        timeout-minutes: 45
        run: scripts/quality --full --json
      - name: Summary
        if: always()
        run: scripts/ci/summary.sh build/quality.json >>"$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: failure() || steps.quality.outputs.retried == 'true'
        run: echo upload
      - name: Notify on failure
        if: (failure() || steps.quality.outputs.retried == 'true') && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          RETRIED: ${{ steps.quality.outputs.retried }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = failure ]; then
            title="Weekly quality gate failed" outcome="failed" again="Failed again"
          else
            title="Weekly quality gate passed on retry" outcome="passed on retry" again="Passed on retry again"
          fi
          open="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$again: $RUN_URL"
          else
            url="$(gh issue create --title "$title" --body "The scheduled \`--full\` run $outcome: $RUN_URL")"
            open="${url##*/}"
          fi
          if [ "$RETRIED" = true ]; then gh issue edit "$open" --add-label flaky-test; fi
