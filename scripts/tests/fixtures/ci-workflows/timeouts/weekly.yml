# Must fail: the test job's timeout is below the Quality gate step's.
jobs:
  test:
    timeout-minutes: 30
    permissions:
      issues: write
    steps:
      - name: Simulator runtime
        timeout-minutes: 20
        run: scripts/ci/install-simulator-runtime.sh
      - name: Quality gate
        timeout-minutes: 45
        run: scripts/quality --full --json
      - name: Summary
        if: always()
        run: scripts/ci/summary.sh build/quality.json >>"$GITHUB_STEP_SUMMARY"
      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        run: gh issue create --title "Weekly quality gate failed"
