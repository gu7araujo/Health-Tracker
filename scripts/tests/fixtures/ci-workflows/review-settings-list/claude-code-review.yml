# Must fail: --setting-sources user,project still loads the repo's .claude/settings.json.
jobs:
  claude-review:
    if: github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: PR files for the review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir .review
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" >.review/pr.diff
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,state,comments >.review/pr.json

      - name: CLAUDE.md for the review
        shell: bash
        run: |
          git ls-files -z '*/AGENTS.md' | while IFS= read -r -d '' f; do cp "$f" "${f%AGENTS.md}CLAUDE.md"; done
          cp scripts/AGENTS.md .github/CLAUDE.md
          cp scripts/AGENTS.md .githooks/CLAUDE.md

      # A comment above the next step is not part of the copy step.
      - name: Run Claude Code Review
        id: claude-review
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }} Rules: the root AGENTS.md stands in for the root CLAUDE.md, which the action resets, and HealthTrackerUITests/CLAUDE.md also covers HealthTrackerIntentsUITests/. Run every step on every open PR, with the four agents of step 4 whatever the diff size: this workflow already excludes drafts and forks, and a PR written with Claude Code still needs the review. Stop early only when the PR is closed or Claude has already commented on it. If you stop before step 4 for any other reason, post a comment with gh pr comment that says why. The diff is in .review/pr.diff and its title, body, state and comments are in .review/pr.json: tell each agent to read those files, since gh pr diff and gh pr view are denied.'
          claude_args: '--setting-sources user,project --allowedTools "mcp__github_inline_comment__create_inline_comment" --disallowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"'

      - name: Review outcome
        if: always() && steps.claude-review.outputs.execution_file != ''
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: jq -r '.[] | select(.type == "result") | (.permission_denials // []) as $d | "turns=\(.num_turns) denials=\($d | length)", ($d | map(.tool_name + if .tool_name == "Bash" then "(\((.tool_input.command? | strings) // "" | [splits("\\s+") | select(length > 0)] | until(length == 0 or (.[0] | test("=") | not); .[1:]) | .[:((map(test("^[a-z][a-z0-9-]*$")) | indices(false)[0]) // length)] | .[:3] | join(" ")))" else "" end) | unique | select(length > 0) | "denied=\(join(","))"), (.result // "")' "$EXECUTION_FILE"
