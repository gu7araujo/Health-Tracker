# Must fail the upload check only, like upload/ci.yml.
jobs:
  test:
    timeout-minutes: 75
    permissions:
      issues: write
    steps:
      - name: Simulator runtime
        timeout-minutes: 20
        run: scripts/ci/install-simulator-runtime.sh
      - name: Quality gate
        id: quality
        timeout-minutes: 45
        run: scripts/quality --full --json
      - name: Summary
        if: always()
        run: scripts/ci/summary.sh build/quality.json >>"$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      - name: Notify on failure or retry
        if: (failure() || steps.quality.outputs.retried == 'true') && github.event_name == 'schedule'
        run: gh issue create --title "Weekly quality gate failed" --label flaky-test
