# Must pass: ci.yml's test steps, a Notify on failure or retry step that opens a flaky-test issue,
# issues: write.
jobs:
  test:
    timeout-minutes: 75
    permissions:
      issues: write
    steps:
      - name: Simulator runtime
        timeout-minutes: 20
        run: scripts/ci/install-simulator-runtime.sh
      - name: Quality gate
        id: quality
        timeout-minutes: 45
        run: scripts/quality --full --json
      - name: Summary
        if: always()
        run: scripts/ci/summary.sh build/quality.json >>"$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: failure() || steps.quality.outputs.retried == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      - name: Notify on failure or retry
        if: (failure() || steps.quality.outputs.retried == 'true') && github.event_name == 'schedule'
        run: |
          title="Weekly quality gate passed on a retry"
          gh issue create --title "$title" --label flaky-test --body "$(jq -r '.retried[]' build/quality.json)"
