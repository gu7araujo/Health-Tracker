# Must fail the draft checks, and only those: draft PRs skip the test job, and marking a PR ready
# re-runs the draft's checks. Dependabot PRs still skip test, so that check passes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  lint:
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Fitness
        run: scripts/fitness/run
      - name: Persisted shape
        if: github.event_name == 'pull_request'
        run: scripts/fitness/persisted-shape-guard.sh HEAD^1
  test:
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft && github.actor != 'dependabot[bot]')
    timeout-minutes: 60
    steps:
      - name: Quality gate
        timeout-minutes: 45
        run: scripts/quality "$MODE" --json
      - name: Summary
        if: always()
        run: scripts/ci/summary.sh build/quality.json >>"$GITHUB_STEP_SUMMARY"
