# Must fail the draft checks, and only those: draft PRs skip the test job, and marking a PR ready
# re-runs the draft's checks. Dependabot PRs still skip test, so that check passes; the exact if:
# check fails, as && binds before || and test would run on docs-only PRs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.agents/**', '.claude/skills/**', '.codex/**']
jobs:
  changes:
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git diff --no-renames --name-only -z HEAD^1 HEAD | scripts/ci/docs-only.sh
  lint:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Fitness
        run: scripts/fitness/run
      - name: Persisted shape
        if: github.event_name == 'pull_request'
        run: scripts/fitness/persisted-shape-guard.sh HEAD^1
  test:
    needs: [changes, lint]
    if: >-
      needs.changes.outputs.code != 'false' && github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft && github.actor != 'dependabot[bot]')
    timeout-minutes: 75
    steps:
      - name: Simulator runtime
        if: env.MODE == '--full'
        timeout-minutes: 20
        run: scripts/ci/install-simulator-runtime.sh
      - name: Quality gate
        timeout-minutes: 45
        run: scripts/quality "$MODE" --json
      - name: Summary
        if: always()
        run: scripts/ci/summary.sh build/quality.json >>"$GITHUB_STEP_SUMMARY"
  ci-gate:
    if: always()
    needs: [changes, lint, test]
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
