# Must fail: draft PRs skip the test job, and marking a PR ready re-runs the draft's checks.
# Must pass the Dependabot check: Dependabot PRs still skip test.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  test:
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft && github.actor != 'dependabot[bot]')
    timeout-minutes: 60
    steps:
      - name: Quality gate
        timeout-minutes: 45
        run: scripts/quality "$MODE" --json
