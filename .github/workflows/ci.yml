name: CI

# The repo is public, so standard GitHub-hosted runners (xcode-27 included) cost nothing; the
# limits below save wall-clock time (--full ~23 min). The Linux lint job gates the macOS test job,
# superseded runs are cancelled, and docs/agent-config-only changes (push's paths-ignore) skip
# lint and test. .claude/hooks and .claude/settings*.json still run them (scripts/tests covers
# them). Every PR runs, so the ci-gate job, the CI check the ruleset requires, always reports.
# Draft PRs run test too, so marking a PR ready (no ready_for_review trigger) needs no run of its own.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.agents/**', '.claude/skills/**', '.codex/**']
  workflow_dispatch:

# Superseded PR runs are cancelled; runs on main are never cancelled, so every merge gets a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # code=false when a PR changes only docs or agent config: lint and test skip, ci-gate passes.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' # other events run everything without a diff
        with:
          persist-credentials: false
          # The PR checkout is a merge commit; depth 2 brings its first parent, the PR base.
          fetch-depth: 2
      - name: Detect code changes
        id: detect
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
            git diff --no-renames --name-only -z HEAD^1 HEAD | scripts/ci/docs-only.sh; then
            echo "code=false" >>"$GITHUB_OUTPUT"
          else
            echo "code=true" >>"$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # linux_amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR checkout is a merge commit; depth 2 brings its first parent (the base), which is all
          # "Persisted shape" diffs against. No later `git fetch` (persist-credentials: false leaves no token).
          fetch-depth: 2
      - name: Install tools
        run: scripts/ci/install-tools.sh
      - name: SwiftFormat
        run: swiftformat . --lint --swift-version 6
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: Fitness
        run: scripts/fitness/run
      # Warn-only: annotates the PR, never fails the job.
      - name: Persisted shape
        if: github.event_name == 'pull_request'
        run: scripts/fitness/persisted-shape-guard.sh HEAD^1
      - name: ShellCheck
        run: grep -rlZE '^#!(/usr/bin/env (ba)?sh|/bin/(ba)?sh)' scripts .githooks .claude/hooks | xargs -0 shellcheck --severity=warning
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" actionlint
          ./actionlint -color

  test:
    needs: [changes, lint]
    # Dependabot PRs only bump pinned actions, so they skip the macOS job: actionlint validates
    # the bump, and the --fast run on main after merge exercises actions/checkout. Accepted risk:
    # upload-artifact runs only if: failure(), so a broken bump of it shows up only when a later
    # test fails.
    if: >-
      needs.changes.outputs.code != 'false' &&
      (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]')
    runs-on: xcode-27
    # Simulator runtime (20) + Quality gate (45) + ~10 for checkout, tools and script tests.
    timeout-minutes: 75
    env:
      CI: "true"
      MODE: ${{ github.event_name == 'push' && '--fast' || '--full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh
      - name: Install tools
        run: scripts/ci/install-tools.sh
      - name: Script tests
        run: scripts/tests/run
      - name: Simulator runtime
        # --full runs HealthTrackerIntentsUITests, which needs a simulator runtime at the SDK's iOS
        # version; the image can ship only an older one, and downloading it takes several minutes.
        if: env.MODE == '--full' # pushes to main run --fast: no intents run
        timeout-minutes: 20
        run: scripts/ci/install-simulator-runtime.sh
      - name: Quality gate
        # With the Simulator runtime step's, below the job's limit: a step timeout fails the step,
        # so the if: failure() steps still run; a job timeout cancels it and skips them.
        timeout-minutes: 45
        run: scripts/quality "$MODE" --json
      - name: Summary
        if: always()
        run: scripts/ci/summary.sh build/quality.json >>"$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult-${{ github.run_id }}
          path: |
            build/*.xcresult
            build/xcodebuild.log
          retention-days: 7

  ci-gate:
    # GitHub counts a skipped required job as passing, so requiring lint and test would pass a PR
    # whose changes job crashed. The ruleset requires ci-gate instead: it always runs, and fails
    # when a job it needs failed or was cancelled. Skipped is fine: docs-only PRs, Dependabot's test.
    if: always()
    needs: [changes, lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, lint, test: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
