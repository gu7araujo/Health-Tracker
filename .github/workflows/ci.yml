name: CI

# Cost controls (≈200 macOS min/month on GitHub Free): the Linux lint job gates the macOS
# test job, draft PRs run lint only, superseded runs are cancelled, and docs/agent-config-only
# changes skip CI. .claude/hooks and .claude/settings*.json still trigger it (scripts/tests covers them).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md', '.agents/**', '.claude/skills/**', '.codex/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.agents/**', '.claude/skills/**', '.codex/**']
  workflow_dispatch:

# Superseded PR runs are cancelled; runs on main are never cancelled, so every merge gets a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # linux_amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: scripts/ci/install-tools.sh
      - name: SwiftFormat
        run: swiftformat . --lint --swift-version 6
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: ShellCheck
        run: grep -rlE '^#!(/usr/bin/env (ba)?sh|/bin/(ba)?sh)' scripts .githooks .claude/hooks | xargs shellcheck --severity=warning
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" actionlint
          ./actionlint -color

  test:
    needs: lint
    # Draft PRs run lint only. Dependabot PRs only bump pinned actions (actionlint covers them),
    # and the --fast run on main after merge still exercises them, so they skip macOS minutes.
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft && github.actor != 'dependabot[bot]')
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      CI: "true"
      MODE: ${{ github.event_name == 'push' && '--fast' || '--full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh
      - name: Install tools
        run: scripts/ci/install-tools.sh
      - name: Script tests
        run: scripts/tests/run
      - name: Quality gate
        run: scripts/quality "$MODE" --json
      - name: Summary
        if: always()
        run: if [ -f build/quality.json ]; then scripts/ci/summary.sh build/quality.json >>"$GITHUB_STEP_SUMMARY"; fi
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult-${{ github.run_id }}
          path: |
            build/*.xcresult
            build/xcodebuild.log
          retention-days: 7
