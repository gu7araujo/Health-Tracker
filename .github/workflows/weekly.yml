name: Weekly

# Full gate on a schedule, to catch drift (runner image, simulator runtime) between PRs.
# The steps duplicate ci.yml's test job on purpose: a reusable workflow would rename the
# future required check to "test / test" and add indirection for a handful of steps.
# Follow-up: HealthTrackerIntentsUITests (iOS 27 runtime) joins here and on push to main
# (an intents-ui-tests job in ci.yml) once feature/app-intents lands; never on PRs.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh
      - name: Install tools
        run: scripts/ci/install-tools.sh
      - name: Script tests
        run: scripts/tests/run
      - name: Quality gate
        run: scripts/quality --full --json
      - name: Summary
        if: always()
        run: if [ -f build/quality.json ]; then scripts/ci/summary.sh build/quality.json >>"$GITHUB_STEP_SUMMARY"; fi
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult-${{ github.run_id }}
          path: |
            build/*.xcresult
            build/xcodebuild.log
          retention-days: 7
