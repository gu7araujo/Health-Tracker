name: Weekly

# Full gate on a schedule, to catch drift (runner image, simulator runtime) between PRs.
# The steps duplicate ci.yml's test job on purpose: a reusable workflow would rename the
# test job's check to "test / test" and add indirection for a handful of steps.
# scripts/tests/test-ci-workflows.sh keeps them in step. A red scheduled run opens an issue
# (or comments on the open one), so it reaches the repo's watchers; so does a green run with a test
# that passed only on its retry, on its own flaky-test issue.
# --full runs HealthTrackerIntentsUITests too (here, on pushes to main and on app PRs), on the
# simulator runtime the Simulator runtime step installs (scripts/ci/install-simulator-runtime.sh).
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    # Simulator runtime (20) + Quality gate (45) + ~10 for checkout, tools and script tests.
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh
      - name: Install tools
        run: scripts/ci/install-tools.sh
      - name: Script tests
        run: scripts/tests/run
      - name: Simulator runtime
        # --full runs HealthTrackerIntentsUITests, which needs a simulator runtime at the SDK's iOS
        # version; the image can ship only an older one, and downloading it takes several minutes.
        timeout-minutes: 20
        run: scripts/ci/install-simulator-runtime.sh
      - name: Quality gate
        id: quality
        # With the Simulator runtime step's, below the job's limit: a step timeout fails the step,
        # so the if: failure() steps still run; a job timeout cancels it and skips them.
        timeout-minutes: 45
        run: scripts/quality --full --json
      - name: Summary
        if: always()
        run: scripts/ci/summary.sh build/quality.json >>"$GITHUB_STEP_SUMMARY"
      - name: Upload results
        # A test that passed on its retry leaves the run green: keep its first attempt as evidence (#141).
        if: failure() || steps.quality.outputs.retried == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult-${{ github.run_id }}
          path: |
            build/*.xcresult
            build/xcodebuild.log
          retention-days: 7
      - name: Notify on failure or retry
        if: (failure() || steps.quality.outputs.retried == 'true') && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          RETRIED: ${{ steps.quality.outputs.retried }}
        run: |
          # A red run and a green run whose test passed only on its retry (a flake to own,
          # HealthTrackerUITests/AGENTS.md rule 6) each keep their own issue.
          title="Weekly quality gate failed" label=""
          [ "$JOB_STATUS" = failure ] || { title="Weekly quality gate passed on a retry"; label=flaky-test; }
          body="The scheduled \`--full\` run ended in $JOB_STATUS: $RUN_URL"
          retried="$(jq -r '.retried[]? | "- " + .' build/quality.json 2>/dev/null || true)"
          [ -z "$RETRIED" ] ||
            body+=$'\n\n'"Passed on retry:"$'\n'"${retried:-- no test listed: a UI bundle reran after a test runner error (see the run warnings)}"
          open="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body" ${label:+--label "$label"}
          fi
