name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Draft PRs skip the review; ready_for_review runs it once the PR is ready.
    # Fork PRs skip it too: they get no secrets, so the run could only fail.
    if: github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The code-review plugin checks CLAUDE.md files only, those on a changed file's path, and this
      # repo keeps its rules in AGENTS.md (#62). scripts/AGENTS.md also governs .github/ and .githooks/.
      # Regular copies, not symlinks: the review's Glob and Grep skip symlinks. Nested only: the action
      # resets the root CLAUDE.md to the base branch's, so the prompt names the root rules.
      - name: CLAUDE.md for the review
        shell: bash
        run: |
          git ls-files -z '*/AGENTS.md' | while IFS= read -r -d '' f; do cp "$f" "${f%AGENTS.md}CLAUDE.md"; done
          cp scripts/AGENTS.md .github/CLAUDE.md
          cp scripts/AGENTS.md .githooks/CLAUDE.md

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }} Rules: the root AGENTS.md stands in for the root CLAUDE.md, which the action resets, and HealthTrackerUITests/CLAUDE.md also covers HealthTrackerIntentsUITests/.'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

