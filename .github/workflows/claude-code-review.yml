name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Draft PRs skip the review; ready_for_review runs it once the PR is ready.
    # Fork PRs skip it too: they get no secrets, so the run could only fail.
    if: github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The plugin grants its sessions gh commands whose --jq reads the runner's environment ($ENV) and
      # whose --repo reaches any host, so a prompt-injected PR could leak the tokens; the review denies
      # them (claude_args) and its agents read the PR from these files, written with the job's token (#62).
      - name: PR files for the review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir .review
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" >.review/pr.diff
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,state,comments,reviews,headRefOid >.review/pr.json

      # The code-review plugin checks CLAUDE.md files only, those on a changed file's path, and this
      # repo keeps its rules in AGENTS.md (#62). scripts/AGENTS.md also governs .github/ and .githooks/.
      # Regular copies, not symlinks: the review's Glob and Grep skip symlinks. Nested only: the action
      # resets the root CLAUDE.md to the base branch's, so the prompt names the root rules.
      - name: CLAUDE.md for the review
        shell: bash
        run: |
          git ls-files -z '*/AGENTS.md' | while IFS= read -r -d '' f; do cp "$f" "${f%AGENTS.md}CLAUDE.md"; done
          cp scripts/AGENTS.md .github/CLAUDE.md
          cp scripts/AGENTS.md .githooks/CLAUDE.md

      # The plugin's step 1 stops, silently, on a PR it judges trivial or automated, every PR here is
      # written with Claude Code, and on a small diff the model skips step 4's agents (#62): the prompt's
      # tail asks for every step and makes any early stop post why. The action reads only the session's
      # first result, and the plugin's agents ran in the background, so the session ended while they
      # ran ("I'll wait for their results", PR #107): background tasks are off, so each agent returns.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }} Rules: the root AGENTS.md stands in for the root CLAUDE.md, which the action resets, and HealthTrackerUITests/CLAUDE.md also covers HealthTrackerIntentsUITests/. Run every step on every open PR, with the four agents of step 4 whatever the diff size: this workflow already excludes drafts and forks, and a PR written with Claude Code still needs the review. Stop early only when the PR is closed or Claude has already commented on it. If you stop before step 4 for any other reason, post a comment with gh pr comment that says why. The diff is in .review/pr.diff, and the title, body, state, comments, reviews and head commit SHA (headRefOid) are in .review/pr.json: tell each agent to read those files, since gh pr diff and gh pr view are denied.'
          # --setting-sources user: the action loads every settings source by default, and the repo's
          # .claude/settings.json allows PR-branch scripts to run with the tokens set (#90). The denied gh
          # commands are the plugin's own grants that take --jq or --repo. gh pr comment stays so the
          # review can post, though its --body-file can still read any file (#146).
          claude_args: '--setting-sources user --allowedTools "mcp__github_inline_comment__create_inline_comment" --disallowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action logs a run's counts but hides the model's closing text, so a run that stopped early
      # looked like one that passed (#62), and a failed run showed only is_error:true (#32). Prints the
      # result message's turn and denial counts, each denied tool once (for Bash, up to three leading
      # command and subcommand names, enough for an allowlist rule) and the closing text, which for an
      # is_error run is the API error, and nothing else: tool results can hold secrets, and the logs are public.
      - name: Review outcome
        if: always() && steps.claude-review.outputs.execution_file != ''
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: jq -r '.[] | select(.type == "result") | (.permission_denials // []) as $d | "turns=\(.num_turns) denials=\($d | length)", ($d | map(.tool_name + if .tool_name == "Bash" then "(\((.tool_input.command? | strings) // "" | [splits("\\s+") | select(length > 0)] | until(length == 0 or (.[0] | test("=") | not); .[1:]) | .[:((map(test("^[a-z][a-z0-9-]*$")) | indices(false)[0]) // length)] | .[:3] | join(" ")))" else "" end) | unique | select(length > 0) | "denied=\(join(","))"), (.result // "")' "$EXECUTION_FILE"

